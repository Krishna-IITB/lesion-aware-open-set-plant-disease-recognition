[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lesion-aware-plant-ood"
version = "0.1.0"
description = "Lesion-aware, few-shot and open-set plant disease recognition research framework"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
authors = [{name = "Project contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
backbones = ["transformers>=4.56,<6"]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
plant-ood = "plant_ood.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_ood"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["plant_ood"]
